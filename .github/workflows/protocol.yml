name: Protocol conformance
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  local-conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            sdk/tests/fuzz/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/fuzz
      - run: npm run check:runtime
      - run: npm run build
      - run: git diff --exit-code -- src/schemas.ts ../spec/generated
      - run: npm run build:pbp
      - run: npm run build:pbp-vectors
      - run: npm run build:pbp-migration
      - run: npm run build:dtp-v04
      - run: git diff --exit-code -- ../spec/v0.4/command.schema.json ../spec/v0.4/signing-vector.json
      - run: git diff --exit-code -- ../supabase/migrations/20260907000000_pbp_v03.sql
      - run: git diff --exit-code -- ../spec/v0.3/command.schema.json ../spec/v0.3/signing-vector.json
      - run: npx --yes deno@2.9.6 check --config ../supabase/functions/pbp-store/deno.json ../supabase/functions/pbp-store/index.ts
      - run: npx --yes deno@2.9.6 run --config ../supabase/functions/pbp-store/deno.json scripts/pbp-runtime-probe.ts
      - run: npx --yes deno@2.9.6 check --config ../supabase/functions/pbp-store/deno.json src/v04/router.ts src/v04/client.ts scripts/dtp-v04-runtime-probe.ts
      - run: npx --yes deno@2.9.6 run --config ../supabase/functions/pbp-store/deno.json scripts/dtp-v04-runtime-probe.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:dtp-v04
      - run: npm run test:stress-business
      - run: npm run demo:passport
      - run: npm run test:fuzz
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dtp
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dtp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtp -d dtp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: node scripts/release-gates.ts run-check --check real-postgres
        env:
          DTP_TEST_DATABASE_URL: postgres://dtp:test-only@127.0.0.1:5432/dtp_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtp-v04-postgres-evidence
          path: |
            docs/release/v04-evidence.json
            docs/release/evidence/
          if-no-files-found: error
